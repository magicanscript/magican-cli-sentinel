[package]
name = "solana-cli-sentinel"
version = "0.1.0"
edition = "2024"
# Verified floor: `cargo +1.89.0 check --all-targets` passes.
# The graph's own highest declared MSRV is 1.88 (darling, serde_with), and the
# let-chain in src/notify/mod.rs also needs 1.88 — so 1.88 is likely sufficient,
# but 1.89 is the oldest toolchain this build has actually been run against.
rust-version = "1.89"

# This crate contains no `unsafe`, and parses input from three untrusted network
# peers. `forbid` makes that structural rather than a matter of review discipline:
# unlike `deny`, it cannot be re-enabled by a local `#[allow]`.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1.38", features = ["full"] }

solana-rpc-client = "2.0"
solana-sdk = "2.0"

reqwest = { version = "0.12", features = ["json"] }

rust-llm-client = { path = "../magican-llm-client" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

clap = { version = "4.5", features = ["derive"] }

anyhow = "1.0"
dotenvy = "0.15"

thiserror = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", features = ["serde"] }

humantime = "2.1"

[dev-dependencies]
# Builds in-memory HTTP responses so the Telegram response-cap tests need no
# network and no server. Already in the graph via reqwest — no new supply chain.
http = "1"
